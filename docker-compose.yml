services:
  postgres:
    image: postgres:16-alpine
    container_name: investigator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - investigator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: investigator-qdrant
    restart: unless-stopped
    ports:
      # Host-side ports are configurable (default 16333/16334, not
      # Qdrant's usual 6333/6334) because that range can collide with a
      # Windows Hyper-V excluded-port range; the container's internal
      # ports stay the Qdrant defaults either way.
      - "${QDRANT_PORT:-16333}:6333" # REST API
      - "${QDRANT_GRPC_PORT:-16334}:6334" # gRPC
    volumes:
      - investigator_qdrant_data:/qdrant/storage

volumes:
  investigator_pgdata:
  investigator_qdrant_data:
